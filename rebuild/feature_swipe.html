<title>Feature Swipe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centered column. Card stack on top, big action buttons below, results as three lists. */
:root{
  --bg:#eef1f6; --panel:#ffffff; --fg:#10192e; --muted:#5b6785; --line:#d3d9e6;
  --accent:#0b3d91; --keep:#17803d; --cut:#c0392b; --maybe:#a8650a; --chip:#e4e9f3;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020; --panel:#141d36; --fg:#e8ecf7; --muted:#97a3c3; --line:#26335a;
  --accent:#6fa3ff; --keep:#3ddc84; --cut:#ff6b5b; --maybe:#ffb454; --chip:#1d2947; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1020; --panel:#141d36; --fg:#e8ecf7; --muted:#97a3c3; --line:#26335a;
  --accent:#6fa3ff; --keep:#3ddc84; --cut:#ff6b5b; --maybe:#ffb454; --chip:#1d2947; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;margin:0;padding-inline:16px;padding-block:14px;overflow-x:hidden}
.wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:var(--disp);font-size:1.6rem;margin:0;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.count{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.cat{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.stack{position:relative;flex:1;min-height:380px;max-height:520px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);user-select:none;transition:transform .25s,opacity .25s;will-change:transform}
.card.drag{transition:none;cursor:grabbing}
.card.top{cursor:grab;touch-action:none}
.card.s1{transform:scale(.96) translateY(14px);opacity:.7}
.card.s2{transform:scale(.92) translateY(28px);opacity:.4}
.card h2{font-family:var(--disp);font-size:2rem;line-height:1.05;margin:0;text-wrap:balance;font-weight:700}
.card p{margin:0;line-height:1.45}
.plain{font-size:1.05rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:.7rem;padding:3px 8px;border-radius:5px;background:var(--chip);color:var(--fg)}
.tag.heavy{color:var(--cut)} .tag.light{color:var(--keep)} .tag.mid{color:var(--maybe)}
.how{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.how b{color:var(--fg);font-weight:600}
.stamp{position:absolute;top:18px;font-family:var(--disp);font-weight:700;font-size:2rem;letter-spacing:.08em;border:3px solid;border-radius:8px;padding:0 10px;opacity:0;pointer-events:none}
.stamp.k{right:18px;color:var(--keep);transform:rotate(8deg)}
.stamp.c{left:18px;color:var(--cut);transform:rotate(-8deg)}
.stamp.m{left:50%;margin-left:-45px;color:var(--maybe)}

.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer}
.act{padding:14px 6px;border-radius:12px;border:2px solid;background:transparent;font-family:var(--disp);font-weight:700;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.act small{display:block;font-family:var(--mono);font-size:.62rem;opacity:.7;letter-spacing:0;text-transform:none}
.act.c{color:var(--cut);border-color:var(--cut)} .act.k{color:var(--keep);border-color:var(--keep)} .act.m{color:var(--maybe);border-color:var(--maybe)}
.act:hover{background:var(--chip)}
.act:focus-visible,.link:focus-visible,.mv:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sub{display:flex;justify-content:space-between;gap:8px}
.link{background:none;border:none;color:var(--accent);font-size:.9rem;padding:4px 0;text-decoration:underline}
.link:disabled{opacity:.35;cursor:default}

.results h2{font-family:var(--disp);font-size:1.7rem;margin:0 0 4px;text-transform:uppercase}
.col{margin-top:14px}
.col h3{font-family:var(--disp);font-size:1.25rem;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.col.k h3{color:var(--keep)} .col.c h3{color:var(--cut)} .col.m h3{color:var(--maybe)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.item span{min-width:0}
.mvs{display:flex;gap:4px;flex-shrink:0}
.mv{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:.72rem}
.summary{font-size:.92rem;color:var(--muted);margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{padding:12px 18px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--bg);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
textarea{width:100%;min-height:120px;margin-top:10px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:.78rem}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---- The feature deck, taken from the fullest version of the site (commit 8bd4907, May 22 2026) ---- */
var DECK = [
 // category, title, plain-English description, weight (light/mid/heavy), status, what it needs behind the scenes
 ["Map","Route map","A map of New York City with every walking route drawn on it. Each route is colored from red to green based on how many times it has been walked.","mid","Live today","A mapping library plus the route shapes saved in a data file."],
 ["Map","Completion color key","A small legend on the map: red means 0 walks, green means the target of 6 or more.","light","Live today","Just a colored bar. Nothing to maintain."],
 ["Map","Route detail panel","Click a route and a side panel opens: length in miles, estimated walk time (at 3 mph), AM / midday / PM counts, a bar chart against the target of 8, and the list of past walks.","mid","Live today","A chart library and the walk log."],
 ["Map","Top stats bar on the map","A strip of summary numbers over the map, such as total walks completed.","light","Live today","Counts read from the walk log."],
 ["Map","Filters","A dropdown to narrow the map and charts by season, time of day, backpack, and a date range.","mid","Live today","Extra logic so every chart recalculates when a filter changes."],
 ["Map","Route groups overlay","A toggle that outlines the routes in their assigned groups so you can see which routes belong together.","mid","Hidden since May","An Excel file of groups that has to stay up to date."],
 ["Map","Collector areas overlay","A toggle showing the general area each collector lives in on the map.","light","Live today","A small list of locations. Privacy is worth thinking about."],
 ["People","Individual collector pages","Pick a collector and see their personal stats and charts: how many walks, which times of day, which routes.","mid","Live today","Chart library and the walk log."],
 ["People","Side-by-side collector comparison","One chart and table comparing every collector over the last 2 weeks, this month, and the whole project.","mid","Live today","Same data as above, just grouped."],
 ["People","Manual log upload and refresh","Buttons to load a walk-log file from your computer or refresh the data by hand.","light","Live today","Almost nothing. A backup for when automatic sync fails."],
 ["Scheduling","Weekly calendar","A week-by-week grid with morning, midday and evening slots for each backpack. You can page forward and back.","heavy","Hidden since May","Date logic, the schedule file, and a server that saves changes."],
 ["Scheduling","Claim a walk slot","A collector clicks an open slot, picks a backpack, route and their name, and claims it. The system blocks double-booking.","heavy","Hidden since May","A server that checks the rules and saves claims safely."],
 ["Scheduling","Edit or cancel a claimed slot","Remove or change an existing claim. Past dates are locked.","heavy","Hidden since May","More server rules and an admin password."],
 ["Scheduling","Weather GO / NO GO","Each slot shows forecast cloud cover. At 50% or below it says GO; above that, NO GO. It is advice only and does not block claims.","heavy","Hidden since May","Pulls the forecast from a Google Sheet your team updates."],
 ["Scheduling","Backpack holder and location","Shows who currently has each backpack (or if it is at CCNY or LaGuardia). Updates from the last completed walk, or by hand.","mid","Hidden since May","Saved status plus a confirmation pop-up."],
 ["Scheduling","Days-since-calibration bars","A green / yellow / red bar per backpack showing how long since its last calibration.","mid","Hidden since May","A calibration date log."],
 ["Scheduling","Log a calibration button","A password-protected button that records that a backpack was just calibrated.","light","Hidden since May","One saved date per backpack plus the password."],
 ["Scheduling","Availability heatmap","A color grid showing how many collectors are free for each day and time slot. Hover to see who.","mid","Hidden since May","An Excel sheet of availability that someone must update each semester."],
 ["Scheduling","Next-day email reminders","Emails collectors the day before their claimed walk. You can preview and send from the site.","heavy","Hidden since May","An email service account, collector opt-in list, and secret passwords."],
 ["Data","Upload walk data","A form to upload a finished walk's GPS track, sensor files and notes. They get filed into the correct Google Drive folder.","heavy","Hidden since May","Google Drive access, file handling and a staging area for failed uploads."],
 ["Data","Automatic Drive sync of the walk log","When new walk files land in Google Drive, the site notices and updates its walk counts by itself.","heavy","Live today","A Google script, a server endpoint, and cloud storage."],
 ["Data","Weather forecast import","Reads the weekly forecast tabs from a Google Sheet and stores cloud cover for each day and part of day.","mid","Live today","Google Sheets access."],
 ["Admin","Admin login","A key button that unlocks editing features with a PIN.","mid","Hidden since May","A secret PIN stored on the server."],
 ["Admin","Rebuild button","Forces the site to refresh its weather and regenerate all pages right now.","light","Hidden since May","Server permission to rerun the build."],
 ["Admin","Admin walk-log tools","Behind-the-scenes controls to clear or rebuild the walk log from Drive.","light","Live today","Server endpoints only. No visible screen."],
 ["Extras","Student (EFD) schedule page","A separate page that lines up the student teams' time blocks from a Google Form export.","mid","Separate page","A CSV from the form and its own script."],
 ["Extras","Automatic schedule maker","The old algorithm that suggested the top 8 walks and built a weekly calendar from weather, availability and subway travel times.","heavy","Retired in May","Used AI to read PDFs. You already moved away from this."],
 ["Extras","Subway travel-time matrix","Computed how long it takes to get between routes by subway, to help the schedule maker.","heavy","Retired in May","Large public transit data files."],
 ["Extras","Standalone collector map page","An older separate map page of collector locations.","light","Retired in May","A leftover script."],
 ["Look","CARTO dark map background","The dark gray-and-black street map under the routes (CARTO \"dark_all\" tiles). Routes glow against it.","light","Live today","Free map tiles from CARTO. No account needed for light use; credit is required."],
 ["Hosting","Public but not searchable","Anyone with the link can open the site, but Google and other search engines are told not to list it (robots.txt, a no-index tag, and a no-index server header).","light","New","Three small settings. Not true privacy: it hides the site from search, but anyone with the link can still see it."],
 ["Hosting","Self-hosted on your own server","Run the new site on your own machine or cheap server instead of Google Cloud Run.","mid","New","A small server, a web address, and an HTTPS certificate. Much less setup if the site is just static files."],
 ["Look","Dark mission-control style and TEMPO logo","The dark blue look, NASA-style header badge, and the TEMPO logo as the browser tab icon.","light","Live today","Styling only."]
];

var KEY="featureSwipe.v1";
var state={i:0,ans:{}}; // ans[index]= 'k' | 'c' | 'm'
var hist=[];
try{var s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.ans){state=s;hist=Object.keys(s.ans).map(Number).sort(function(a,b){return a-b})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
var app=document.getElementById("app");
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var WT={light:"Lightweight",mid:"Medium effort",heavy:"Heavy lift"};

function cardHTML(f,cls){
  return '<div class="card '+cls+'"><div class="stamp k">KEEP</div><div class="stamp c">CUT</div><div class="stamp m">MAYBE</div>'+
  '<div class="cat">'+esc(f[0])+'</div><h2>'+esc(f[1])+'</h2><p class="plain">'+esc(f[2])+'</p>'+
  '<div class="tags"><span class="tag '+f[3]+'">'+WT[f[3]]+'</span><span class="tag">'+esc(f[4])+'</span></div>'+
  '<p class="how"><b>Behind the scenes:</b> '+esc(f[5])+'</p></div>';
}

function render(){
  if(state.i>=DECK.length){return results()}
  var f=DECK[state.i], pct=Math.round(state.i/DECK.length*100);
  var html='<header><h1>Feature Swipe</h1><span class="count">'+(state.i+1)+' / '+DECK.length+'</span></header>'+
   '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="stack" id="stack">';
  for(var k=2;k>=0;k--){var j=state.i+k; if(j<DECK.length) html+=cardHTML(DECK[j],k==0?'top':'s'+k)}
  html+='</div><div class="actions">'+
   '<button class="act c" data-a="c">Cut<small>&larr; left</small></button>'+
   '<button class="act m" data-a="m">Maybe<small>&uarr; up</small></button>'+
   '<button class="act k" data-a="k">Keep<small>right &rarr;</small></button></div>'+
   '<div class="sub"><button class="link" id="undo"'+(hist.length?'':' disabled')+'>Undo last</button>'+
   '<button class="link" id="skipEnd">See results now</button></div>'+
   '<p class="note">Swipe the card, use the buttons, or press the arrow keys.</p>';
  app.innerHTML=html;
  bind();
}

function answer(a){
  if(state.i>=DECK.length)return;
  var top=document.querySelector(".card.top");
  var dx=a=="k"?600:a=="c"?-600:0, dy=a=="m"?-600:0;
  if(top){top.classList.remove("drag");top.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(dx/25)+"deg)";top.style.opacity="0"}
  state.ans[state.i]=a;hist.push(state.i);state.i++;save();
  setTimeout(render,top?220:0);
}
function undo(){
  if(!hist.length)return;
  var last=hist.pop();delete state.ans[last];state.i=last;save();render();
}

function bind(){
  document.querySelectorAll(".act").forEach(function(b){b.onclick=function(){answer(b.dataset.a)}});
  document.getElementById("undo").onclick=undo;
  document.getElementById("skipEnd").onclick=function(){state.i=DECK.length;save();render()};
  var top=document.querySelector(".card.top"); if(!top)return;
  var sx=0,sy=0,dx=0,dy=0,on=false;
  function stamps(){
    var k=Math.min(1,Math.max(0,dx/100)), c=Math.min(1,Math.max(0,-dx/100)), m=Math.min(1,Math.max(0,-dy/100));
    top.querySelector(".stamp.k").style.opacity=k;top.querySelector(".stamp.c").style.opacity=c;top.querySelector(".stamp.m").style.opacity=(Math.abs(dy)>Math.abs(dx))?m:0;
  }
  top.addEventListener("pointerdown",function(e){on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;top.classList.add("drag");try{top.setPointerCapture(e.pointerId)}catch(x){}});
  top.addEventListener("pointermove",function(e){if(!on)return;dx=e.clientX-sx;dy=Math.min(0,e.clientY-sy);
    top.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(dx/25)+"deg)";stamps()});
  function end(){
    if(!on)return;on=false;top.classList.remove("drag");
    if(dx>100)return answer("k"); if(dx<-100)return answer("c"); if(dy<-100&&Math.abs(dy)>Math.abs(dx))return answer("m");
    top.style.transform="";dx=dy=0;stamps();
  }
  top.addEventListener("pointerup",end);top.addEventListener("pointercancel",end);
}
document.addEventListener("keydown",function(e){
  if(state.i>=DECK.length)return;
  if(e.key=="ArrowRight")answer("k");else if(e.key=="ArrowLeft")answer("c");else if(e.key=="ArrowUp"){e.preventDefault();answer("m")}
  else if((e.key=="z"||e.key=="Backspace")&&hist.length)undo();
});

function groups(){
  var g={k:[],c:[],m:[]};
  DECK.forEach(function(f,idx){var a=state.ans[idx]; if(g[a])g[a].push(idx)});
  return g;
}
function summaryText(){
  var g=groups(),t="MY FEATURE CHOICES\n";
  [["k","KEEP"],["m","MAYBE"],["c","CUT"]].forEach(function(p){
    t+="\n"+p[1]+" ("+g[p[0]].length+"):\n"+g[p[0]].map(function(i){return "- "+DECK[i][1]}).join("\n")+"\n";
  });
  return t;
}
function results(){
  var g=groups(), unseen=DECK.length-Object.keys(state.ans).length;
  var kept=g.k.map(function(i){return DECK[i][3]}), heavy=kept.filter(function(w){return w=="heavy"}).length;
  var h='<header><h1>Your picks</h1><span class="count">'+Object.keys(state.ans).length+' / '+DECK.length+'</span></header><div class="results">'+
   '<p class="summary">You are keeping '+g.k.length+' features, '+heavy+' of them heavy lifts. Tap a button on any row to change your mind.'+(unseen?' You skipped '+unseen+' cards, which are left out below.':'')+'</p>';
  [["k","Keep"],["m","Maybe"],["c","Cut"]].forEach(function(p){
    h+='<div class="col '+p[0]+'"><h3><span>'+p[1]+'</span><span>'+g[p[0]].length+'</span></h3>';
    g[p[0]].forEach(function(i){
      h+='<div class="item"><span>'+esc(DECK[i][1])+'</span><span class="mvs">'+
      ["k","m","c"].filter(function(x){return x!=p[0]}).map(function(x){return '<button class="mv" data-i="'+i+'" data-a="'+x+'">'+{k:"Keep",m:"Maybe",c:"Cut"}[x]+'</button>'}).join("")+'</span></div>';
    });
    if(!g[p[0]].length)h+='<p class="note">Nothing here.</p>';
    h+='</div>';
  });
  h+='<div class="row"><button class="btn" id="copy">Copy my picks</button><button class="btn ghost" id="again">Start over</button></div>'+
   '<p class="note" id="copied">Copy the list and paste it back into our chat. I will build the new site from it.</p>'+
   '<textarea id="out" readonly aria-label="Your picks as text">'+esc(summaryText())+'</textarea></div>';
  app.innerHTML=h;
  document.querySelectorAll(".mv").forEach(function(b){b.onclick=function(){state.ans[b.dataset.i]=b.dataset.a;save();results()}});
  document.getElementById("again").onclick=function(){state={i:0,ans:{}};hist=[];save();render()};
  document.getElementById("copy").onclick=function(){
    var ta=document.getElementById("out"),n=document.getElementById("copied");
    function fallback(){ta.focus();ta.select();n.textContent="Text selected. Press Ctrl+C (or Cmd+C) to copy."}
    try{navigator.clipboard.writeText(ta.value).then(function(){n.textContent="Copied. Paste it into our chat."},fallback)}catch(e){fallback()}
  };
}
render();
</script>
